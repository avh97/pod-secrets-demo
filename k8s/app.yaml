apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: pod-secrets-demo:local
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/appdb
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: {app: app}
  ports:
    - port: 8080
