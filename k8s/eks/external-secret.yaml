# EKS only: copies the password from AWS Secrets Manager into the Kubernetes Secret "db-credentials".
# Kept in its own sub-folder so that `kubectl apply -f k8s/` on minikube does not pick it up (minikube has no External Secrets).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws, kind: SecretStore}
  target: {name: db-credentials}
  data:
    - secretKey: DB_PASSWORD
      remoteRef: {key: pod-secrets/db, property: password}
